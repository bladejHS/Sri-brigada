/* ---------- greutăți pe serie + progresie ---------- */
// schema țintă din descriere: "4×8–10", "5×3–6", "12 runde × 5 rep"
function parseScheme(detail){
  const t=(detail||'').replace(/\s/g,'');
  // schemă în val: "6serii:8-5-5-5-3-8rep"
  const wv=t.match(/(\d+)serii?:((?:\d+-){2,}\d+)rep/i);
  if(wv){
    const seq=wv[2].split('-').map(Number);
    return {sets:+wv[1], lo:Math.min(...seq), hi:Math.max(...seq), wave:seq};
  }
  const m=t.match(/(\d+)(?:runde)?[×x](\d+)(?:[–-](\d+))?(?![\ds])/i);
  if(!m) return null;
  const sets=+m[1], lo=+m[2], hi=m[3]?+m[3]:+m[2];
  if(sets>20||lo>60) return null;
  return {sets,lo,hi};
}
function liftKey(name){ return name.replace(/^ABDOMEN — /,'').trim(); }
function liftHist(name){ return ((S.lifts||{})[liftKey(name)])||[]; }
function e1rm(w,r){ return w>0? Math.round(w*(1+r/30)) : 0; }
function stepFor(name){
  const n=name.toLowerCase();
  if(/weighted|vest|centur/.test(n)) return 2.5;
  return 2.5;
}
// dublă progresie: umpli intervalul de repetări, apoi crești greutatea
function suggest(name, detail){
  const sc=parseScheme(detail); if(!sc) return null;
  const h=liftHist(name); const last=h[h.length-1];
  if(!last||!last.s.length) return {txt:`${sc.sets}×${sc.lo}${sc.hi>sc.lo?'–'+sc.hi:''} — prima sesiune, alege o greutate cu care termini toate seriile`,first:true};
  const ws=last.s.map(x=>x[0]), rs=last.s.map(x=>x[1]);
  const w=Math.max(...ws), minR=Math.min(...rs), done=last.s.length;
  const bw=w<=0;
  if(sc.wave && !bw){
    const seq=sc.wave.join('-');
    // seria cea mai grea = cea cu cele mai puține repetări din val
    const iTop=sc.wave.indexOf(Math.min(...sc.wave));
    const topSet=last.s[iTop];
    if(topSet && topSet[1]>=sc.wave[iTop]){
      const nw=w+stepFor(name);
      return {txt:`${seq} — ai închis seria grea, urcă la ${nw} kg pe seriile de ${sc.wave[iTop]}`, w:nw, r:sc.wave[0], up:true};
    }
    return {txt:`${seq} @ până la ${w} kg — repetă greutatea până închizi seria de ${sc.wave[iTop]}`, w:ws[0]||w, r:sc.wave[0]};
  }
  if(bw){
    const tot=rs.reduce((a,b)=>a+b,0);
    return {txt:`${sc.sets}×${minR+1} rep (data trecută: ${rs.join('/')} = ${tot} total)`, w:0, r:minR+1};
  }
  if(minR>=sc.hi && done>=sc.sets){
    const nw=w+stepFor(name);
    return {txt:`${sc.sets}×${sc.lo} @ ${nw} kg — ai umplut intervalul, crește greutatea`, w:nw, r:sc.lo, up:true};
  }
  if(minR<sc.lo){
    const nw=Math.max(stepFor(name), Math.round((w*0.92)/stepFor(name))*stepFor(name));
    return {txt:`${sc.sets}×${sc.lo} @ ${nw} kg — ai ratat intervalul, scade ~8%`, w:nw, r:sc.lo, down:true};
  }
  return {txt:`${sc.sets}×${minR+1} @ ${w} kg — aceeași greutate, adaugă o repetare`, w, r:minR+1};
}
function bestE1rm(name){
  let b=0,d='';
  liftHist(name).forEach(s=>s.s.forEach(([w,r])=>{const e=e1rm(w,r); if(e>b){b=e;d=s.d;}}));
  return b?{v:b,d}:null;
}
function setLogUI(name, detail, dk, id){
  const sc=parseScheme(detail), sg=suggest(name,detail), h=liftHist(name);
  const todaySess=(h[h.length-1]&&h[h.length-1].d===todayKey())?h[h.length-1]:null;
  const sets=todaySess?todaySess.s:[];
  const prev=h.filter(x=>x.d!==todayKey()).slice(-1)[0];
  const best=bestE1rm(name);
  const rows=sets.map((st,i)=>`<div class="setrow">
    <span class="setn mono">${i+1}</span>
    <input class="inp setcell" type="number" inputmode="decimal" step="0.5" value="${st[0]||''}" placeholder="kg"
      data-setedit="${esc(name)}" data-i="${i}" data-f="w">
    <input class="inp setcell" type="number" inputmode="numeric" value="${st[1]||''}" placeholder="rep"
      data-setedit="${esc(name)}" data-i="${i}" data-f="r">
    <span class="sete mono">${st[0]>0?e1rm(st[0],st[1])+' 1RM':''}</span>
    <button class="btn ghost sm" data-act="setdel" data-n="${esc(name)}" data-i="${i}">${ic('trash')}</button>
  </div>`).join('');
  return `<div class="setlog">
    ${sc&&sc.wave?`<div class="prevline mono">Schema: ${sc.wave.map((r,i)=>`<span class="${i===sets.length?'wnow':''}">${r}</span>`).join(' · ')}</div>`:''}
    ${sg?`<div class="sugg ${sg.up?'up':sg.down?'down':''}">${ic('trend')} <b>Următoarea:</b> ${esc(sg.txt)}</div>`:''}
    ${prev?`<div class="prevline mono">Sesiunea trecută (${shortDate(prev.d)}): ${prev.s.map(x=>(x[0]>0?x[0]+'kg×':'')+x[1]).join(' · ')}</div>`:''}
    ${rows}
    <div class="setadd">
      <button class="btn sm" data-act="setadd" data-n="${esc(name)}"
        data-w="${sg&&sg.w?sg.w:0}" data-r="${sc&&sc.wave?(sc.wave[sets.length]||sc.wave[sc.wave.length-1]):(sg&&sg.r?sg.r:(sc?sc.lo:0))}">
        ${ic('plus')} Adaugă serie</button>
      ${best?`<span class="hint mono">record estimat 1RM: ${best.v} kg</span>`:''}
    </div>
  </div>`;
}

/* ---------- planul de alergare, editabil de utilizator ----------
   Pentru fiecare bloc: minute pe repriză + câte reprize în fiecare din cele 4 săptămâni.
   Rulajul lung are o singură „repriză", deci acolo cele 4 cifre sunt direct minutele. */
const RUN_DEFAULT=[
 {int:{m:1,   r:[4,5,6,3],  rest:2},   tmp:{m:1.5, r:[4,5,5,3],  rest:2},   lng:{w:[10,10,11,6], split:'reprize de 1 min alergare / 2 min mers'}},
 {int:{m:2,   r:[3,4,4,2],  rest:2},   tmp:{m:4,   r:[2,2,2,1],  rest:3},   lng:{w:[12,13,16,10],split:'2 blocuri continue, 5 min mers între ele'}},
 {int:{m:3,   r:[3,3,4,2],  rest:3},   tmp:{m:5,   r:[2,2,2,1],  rest:3},   lng:{w:[15,18,18,12],split:'2 blocuri continue, 5 min mers între ele'}},
 {int:{m:3,   r:[3,3,3,2],  rest:3},   tmp:{m:8,   r:[2,2,3,1],  rest:3},   lng:{w:[18,20,18,13],split:'continuu, fără mers'}},
 {int:{m:4,   r:[2,2,1,1],  rest:4},   tmp:{m:8,   r:[3,3,2,1],  rest:3},   lng:{w:[20,22,20,12],split:'continuu, fără mers'}}
];
function runPlan(b){
  const saved=(S.runPlan||{})[b];
  const d=RUN_DEFAULT[Math.max(0,Math.min(b,RUN_DEFAULT.length-1))];
  if(!saved) return JSON.parse(JSON.stringify(d));
  return {int:Object.assign({},d.int,saved.int||{}),
          tmp:Object.assign({},d.tmp,saved.tmp||{}),
          lng:Object.assign({},d.lng,saved.lng||{})};
}
const mmss=v=>{ const t=Math.round(v*60); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
function runMinutes(b,w){
  const p=runPlan(b);
  const i=(p.int.r[w]||0)*p.int.m, t=(p.tmp.r[w]||0)*p.tmp.m, l=p.lng.w[w]||0;
  return {int:i, tmp:t, lng:l, total:i+t+l};
}
/* ---------- jurnalul de alergări ---------- */
const RUN_KINDS=[['int','Intervale','zap'],['tmp','Tempo','flame'],['lng','Rulaj lung','activity']];
const RUN_KMAP=Object.fromEntries(RUN_KINDS.map(k=>[k[0],k]));
const paceOf=r=>(r.km>0&&r.min>0)?r.min/r.km:null;
const fmtPace=p=>p==null?'—':mmss(p)+' /km';
/* minute și km alergați în ultimele 7 zile care se termină la data dată */
function runWeek(endKey){
  const from=dayShift(endKey,-6);
  const rows=(S.runs||[]).filter(r=>r.date>=from&&r.date<=endKey);
  return {min:rows.reduce((a,r)=>a+(+r.min||0),0),
          km: rows.reduce((a,r)=>a+(+r.km||0),0), n:rows.length};
}
/* seria de volum săptămânal, pe săptămâni calendaristice terminate luni */
function runWeeklySeries(){
  const rs=(S.runs||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!rs.length) return [];
  const bucket={};
  rs.forEach(r=>{ const k=mondayOf(r.date);
    bucket[k]=bucket[k]||{km:0,min:0}; bucket[k].km+=(+r.km||0); bucket[k].min+=(+r.min||0); });
  return Object.keys(bucket).sort().map(k=>({k,km:bucket[k].km,min:bucket[k].min}));
}
/* regula de oprire: durere care crește a doua zi */
function painFlag(){
  const rs=(S.runs||[]).slice().sort((a,b)=>a.date<b.date?-1:1).slice(-6);
  const hurt=rs.filter(r=>(+r.pain||0)>=2);
  if(!hurt.length) return null;
  const last=hurt[hurt.length-1];
  return {date:last.date, n:hurt.length,
    msg:hurt.length>=2
      ? 'Ai bifat durere de nivel 2 sau 3 la '+hurt.length+' din ultimele '+rs.length+' alergări. Asta nu mai e oboseală, e un semnal. Scade volumul cu 30% sau ia o săptămână ușoară.'
      : 'Ai bifat durere de nivel 2 la ultima alergare ('+shortDate(last.date)+'). Dacă se repetă, scazi — nu crești.'};
}

/* ritmul folosit doar ca să traducem minutele în km orientativ */
const RUN_PACE=7.5;
function runKm(b,w){ return runMinutes(b,w).total/RUN_PACE; }
/* săptămâna de vârf a unui bloc = maximul din primele 3 */
function peakMin(b){ return Math.max(runMinutes(b,0).total,runMinutes(b,1).total,runMinutes(b,2).total); }
/* avertismentele care ies din cercetare, calculate pe cifrele LUI */
function runWarnings(){
  const out=[];
  const km1=runKm(0,0);
  if(km1>3) out.push({lvl:'bad',t:'Săptămâna 1 are '+km1.toFixed(1)+' km',
    d:'Peste 3 km în prima săptămână, la IMC peste 30, înseamnă +14 puncte procentuale risc de accidentare. Scade blocul 1.'});
  for(let b=1;b<RUN_DEFAULT.length;b++){
    const prev=peakMin(b-1), now=runMinutes(b,0).total;
    if(prev<=0) continue;
    const ch=(now-prev)/prev*100;
    if(ch>12) out.push({lvl:'bad',t:'Blocul '+(b+1)+' sare cu '+ch.toFixed(0)+'%',
      d:'De la '+prev.toFixed(0)+' la '+now.toFixed(0)+' min pe săptămână. Peste 10–12% între blocuri e zona în care rupi ceva.'});
    else if(ch>10) out.push({lvl:'mid',t:'Blocul '+(b+1)+' sare cu '+ch.toFixed(0)+'%',
      d:'La limită. Merge, dar nu mai crește nimic altceva în săptămâna aia.'});
  }
  for(let b=0;b<RUN_DEFAULT.length;b++){
    const m=runMinutes(b,2), share=m.total?m.lng/m.total*100:0;
    if(share>50) out.push({lvl:'mid',t:'Blocul '+(b+1)+': rulajul lung e '+share.toFixed(0)+'% din volum',
      d:'Peste jumătate din alergarea săptămânii într-o singură ieșire. Merge la 3 zile, dar e limita de sus.'});
    if(runMinutes(b,3).total>m.total*0.75) out.push({lvl:'mid',t:'Blocul '+(b+1)+' n-are descărcare reală',
      d:'Săptămâna 4 ar trebui să fie în jur de 60% din săptămâna 3. E ziua de test — ai nevoie de picioare odihnite.'});
  }
  return out;
}

/* ziua de test diferă pe blocuri: 1000 m intră din blocul 2, 50 m din blocul 3 */
function testDay(b){
  const ex=[
    ['Încălzire completă','12–15 min: band pull-apart, dead hang, push-ups ușoare'],
    ['Pull-up maxim','1 serie la eșec tehnic, fără balans · pauză 6 min'],
    ['Dip maxim','1 serie la eșec tehnic, braț paralel cu solul · pauză 6 min'],
    ['Push-up maxim','1 serie la eșec tehnic, pieptul la pumn']];
  if(b>=2) ex.push(['50 m contra-cronometru','2 încercări, start din picioare · pauză completă 5 min între ele — reții timpul cel mai bun']);
  if(b>=1) ex.push(['1000 m contra-cronometru','o singură încercare, teren plat · 10 min mers ușor după — nu o faci dacă ai durere de la ultima alergare']);
  ex.push(['Cântar','notează și greutatea de azi în Nutriție']);
  ex.push(['Notează rezultatele în Progres','fără asta, porțile rămân pe estimări']);
  return {t:b>=1?'Zi de test — standarde + alergare':'Zi de test — cele 3 standarde',
          k:'cal',min:b>=1?75:55,ex};
}
// săptămâna 4 din fiecare ciclu = descărcare; ziua 3 a acelei săptămâni e test
function isDeload(w){ return w===CYC_WEEKS-1; }
const DELOAD_NOTE=' · săptămână de descărcare';
function dayFor(b,w,d){
  if(w===CYC_WEEKS-1&&d===2) return testDay(b);
  const day=BLOCKS[b].days[d];
  if(!/Alergare/.test(day.t)) return day;
  // prescripția de alergare se scrie din planul lui, pentru săptămâna curentă
  const p=runPlan(b), dl=(w===CYC_WEEKS-1)?DELOAD_NOTE:'';
  const out=Object.assign({},day,{ex:day.ex.map(e=>e.slice())});
  const set=(re,txt)=>{ const row=out.ex.find(x=>re.test(x[0])); if(row) row[1]=txt+(row[1].indexOf('—')>=0?' — '+row[1].split('—').slice(1).join('—').trim():''); };
  if(/intervale|ascuțire/i.test(day.t)){
    const r=p.int.r[w]||0;
    set(/Interval|Alergare-mers|Repetări de cursă/i,
      r+' × '+mmss(p.int.m)+' · pauză '+p.int.rest+' min'+dl);
  } else if(/tempo/i.test(day.t)){
    const r=p.tmp.r[w]||0;
    set(/^Tempo|^Reprize/i, r+' × '+mmss(p.tmp.m)+' · pauză mers '+p.tmp.rest+' min'+dl);
  } else if(/rulaj lung/i.test(day.t)){
    set(/Rulaj lung|Run-walk lung/i, (p.lng.w[w]||0)+' min alergare · '+p.lng.split+dl);
  }
  return out;
}
/* ---------- scara de blocuri: ciclu curent + poartă ---------- */
function activeBlock(){ return Math.max(0,Math.min(S.curBlock||0,BLOCKS.length-1)); }
function shownBlock(){ return S.weekBlock==null?activeBlock():Math.max(0,Math.min(S.weekBlock,BLOCKS.length-1)); }
function cycOf(b){ return ((S.cyc||{})[b])||1; }
function curWeight(){
  const t=trend(); if(t&&t.last) return t.last;
  const a=weights(); if(a.length) return a[a.length-1].w;
  return nSet().startW;
}
// criteriile care deschid blocul următor; greutatea e criteriu recomandat, nu blocant
function gateStatus(b){
  const G=BLOCKS[b].gate; if(!G) return null;
  const t=latestFull(), w=curWeight();
  const items=[
    {k:'Pull-ups', ok:!!t&&t.pull>=G.pull,     cur:t?t.pull+' rep':'—',   need:'≥ '+G.pull+' rep'},
    {k:'Dips',     ok:!!t&&t.sprint>=G.sprint, cur:t?t.sprint+' rep':'—', need:'≥ '+G.sprint+' rep'},
    {k:'Push-ups', ok:!!t&&t.run>=G.run,       cur:t?t.run+' rep':'—',    need:'≥ '+G.run+' rep'}
  ];
  if(G.k1000){ const v=lastOf('k1000');
    items.push({k:'1000 m', ok:v!=null&&v<=G.k1000,
      cur:v!=null?fmtTime(v):'—', need:'≤ '+fmtTime(G.k1000)}); }
  if(G.s50){ const v=lastOf('s50');
    items.push({k:'50 m', ok:v!=null&&v<=G.s50,
      cur:v!=null?v.toFixed(2)+' s':'—', need:'≤ '+G.s50.toFixed(2)+' s'}); }
  const wItem={k:'Greutate',soft:true,ok:w<=G.w,cur:w.toFixed(1)+' kg',need:'≤ '+G.w+' kg'};
  const pass=items.every(x=>x.ok), missing=items.filter(x=>!x.ok).map(x=>x.k);
  return {items:items.concat([wItem]),pass,missing,hasTest:!!t,last:BLOCKS.length-1===b};
}
function mondayOf(k){ const d=new Date(k+'T00:00'); const off=(d.getDay()+6)%7; return dayShift(k,-off); }
function dayKey(b,w,d){ return 'b'+b+'c'+cycOf(b)+'w'+w+'d'+d; }
function exId(b,w,d,x){ return dayKey(b,w,d)+'e'+x; }
function dayNum(b,w,d){ return w*CYC_DAYS+d+1; }
function daysTrained(){
  const log=S.wlog||{}; let n=0;
  for(const k in log){ if(Object.keys(log[k]||{}).some(x=>x!=='__min')) n++; }
  return n;
}
function dayDone(b,w,d,day){
  const log=(S.wlog||{})[dayKey(b,w,d)]||{};
  let n=0; day.ex.forEach((_,x)=>{ if(log[exId(b,w,d,x)]) n++; });
  return n;
}
function dayFull(b,w,d,day){ return day.ex.length>0 && dayDone(b,w,d,day)===day.ex.length; }
// ziua curentă = prima neterminată din bloc
function nextDay(b){
  const B=BLOCKS[b];

  return {w:B.weeks-1,d:B.days.length-1};
}

        ${day.k==='rest'?'':`<div class="sess-bar">

        volumul de alergare și păstrează intensitatea. Adaptările apar acum, nu în săptămânile grele.

          ${gs.pass&&gs.last?`<span class="hint">Ești la 10 la toate. Rămâi aici și fii gata oricând.</span>`:''}
          <button class="btn ghost sm" data-act="gateRepeat">${ic('reset')} Repetă blocul (ciclul ${cycOf(b)+1})</button>
          ${b>0?`<button class="btn ghost sm" data-act="gateBack">${ic('chev')} Înapoi un bloc</button>`:''}
        </div>
        ${!gs.pass?`<div class="hint" style="margin-top:8px">Îți lipsește: <b>${gs.missing.join(', ')||'un test complet'}</b>.
          Repetarea blocului nu e un pas înapoi — e doza care n-a fost încă livrată integral.</div>`:''}
      </div>`:''}
      <div class="wprog">
        <div class="wprog-h"><span>${B.note}</span><span class="mono">${totDone}/${totAll} · ${pct}%</span></div>

      </div>
    </div>
    <div class="dgrid">${cards}</div>
    <div class="panel"><div class="wfoot">
      <b>Ritm:</b> 8 zile de program nu înseamnă 8 zile de calendar — dacă prinzi o tură grea, sari peste și reiei de unde ai rămas. Sesiunea ratată se sare, nu se recuperează.<br>
      <b>Descărcare:</b> săptămâna 4 din fiecare ciclu, marcată cu ↓. Nu e opțională.<br>
      <b>Zi de test:</b> ziua 3 din săptămâna 4 — cele 3 probe, și verdictul pentru poartă.<br>
      <b>Zile tari:</b> maxim două pe ciclu și niciodată consecutive. Dacă turele te obligă să le lipești, sacrifici a doua.<br>
      <b>Volumul de bodyweight urcă în rampă</b> de la un bloc la altul. La gabaritul tău tendoanele cedează înaintea mușchilor dacă sari direct la volumul complet.<br>
      <button class="btn ghost sm" data-act="wreset" style="margin-top:10px">${ic('reset')} Resetează bifele săptămânii ${wk+1}</button>
    </div></div>
  </div>`;
}

function viewTools(){
  const cBw=+S.paceM||0, cRep=+S.paceS||0, cTgt=S.paceNote;
  const oneRm=cBw>0&&cRep>0?cBw*(1+cRep/30):0;
  const addFor=r=>oneRm?Math.round((oneRm/(1+r/30)-cBw)*2)/2:0;
  const rows=[3,5,8,10,12].map(r=>[r,addFor(r)]);

  const g=S.gtg||{}, max=g.max||0, tk=todayKey();
  const gdays=g.days||{}, gtoday=gdays[tk]||[], gtarget=max?Math.max(1,Math.round(max*0.5)):0;
  const gtotal=gtoday.reduce((a,b)=>a+b,0);


  const T=S.timer, cfg=TPRESETS[T.cfg];
  const totalP=T.phase==='work'?cfg.work:T.phase==='rest'?cfg.rest:T.phase==='prep'?cfg.prep:1;
  const frac=(T.phase==='idle'||T.phase==='done')?0:T.left/totalP;
  const R=100,C=2*Math.PI*R;
  const tcol=T.phase==='work'?'var(--signal)':T.phase==='rest'?'var(--ok)':T.phase==='done'?'var(--ok)':'var(--mute2)';
  const tlabel={work:'EFORT',rest:'PAUZĂ',prep:'PREGĂTIRE',done:'GATA',idle:'STANDBY'}[T.phase];

  return `<div class="fade">
  <div class="panel"><div class="panel-t">${ic('calc')} Calculator greutate adăugată</div>
    <p class="muted">Pentru weighted pull-ups și weighted dips. Introdu greutatea ta și câte repetări scoți
    fără greutate — îți spune cât să atârni de centură ca să pici pe intervalul dorit.</p>
    <div class="grid2" style="margin-top:12px">
      <div class="field"><label>Greutatea ta (kg)</label>
        <input class="inp" type="number" inputmode="decimal" id="paceM" value="${S.paceM}"></div>
      <div class="field"><label>Maxim fără greutate (rep)</label>
        <input class="inp" type="number" inputmode="numeric" id="paceS" value="${S.paceS}"></div>
    </div>
    <div class="divider"></div>
    ${oneRm?`<div class="hint">Maxim estimat pentru o repetare: <b class="mono" style="color:var(--tan)">${Math.round(oneRm)} kg</b> (corp + greutate)</div>
    <table class="tbl"><thead><tr><th>Ținta</th><th>Adaugi</th><th>Total ridicat</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="${r[0]===cTgt?'hl':''}"><td>${r[0]} rep</td>
        <td class="n">${r[1]>0.4?'+'+r[1].toFixed(1)+' kg':r[1]<-0.4?'asistență '+Math.abs(r[1]).toFixed(1)+' kg cu bandă':'greutatea corpului'}</td>
        <td>${Math.round(cBw+r[1])} kg</td></tr>`).join('')}
    </tbody></table>
    <div class="hint" style="margin-top:10px">Estimare Epley — e o formulă, nu o măsurătoare. Pornește cu 2 kg
    sub ce spune tabelul și urcă dacă seria iese curată.</div>`
    :`<div class="hint">Completează ambele câmpuri ca să vezi tabelul.</div>`}
    <div class="divider"></div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="hint">Intervalul pe care lucrezi:</div>
      ${[3,5,8,10].map(n=>`<button class="chip ${cTgt===n?'on':''}" data-act="pnote" data-i="${n}">${n} rep</button>`).join('')}
    </div>
  </div>

  <div class="panel"><div class="panel-t">${ic('info')} Imagine de fundal</div>
    <p class="muted">Alege o imagine și aplicația o pune în spatele conținutului: o redimensionează,
    o trece pe alb-negru și o estompează spre partea de jos ca textul să rămână lizibil.
    Rămâne salvată pe telefonul tău.</p>
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <label class="btn solid" style="cursor:pointer">${ic('plus')} Alege imagine
        <input type="file" id="bgFile" accept="image/*" style="display:none"></label>
      ${S.bgImg?`<button class="btn ghost" data-act="bgClear">${ic('trash')} Scoate</button>`:''}
      ${S.bgImg?`<span class="hint">imagine încărcată</span>`:`<span class="hint">nicio imagine</span>`}
    </div>
    ${S.bgImg?`<div class="divider"></div>
      <div class="hint">Cât de vizibilă:</div>
      <div class="chips" style="margin-top:8px">
        ${[8,16,24,34].map(o=>`<button class="chip ${(+S.bgOp||16)===o?'on':''}" data-act="bgOp" data-i="${o}">${o}%</button>`).join('')}
      </div>`:''}
  </div>

  <div class="panel"><div class="panel-t">${ic('timer')} Cronometru intervale</div>
    <div class="chips" style="margin-top:10px">
      ${TPRESETS.map((p,i)=>`<button class="chip ${T.cfg===i?'on':''}" data-act="tpreset" data-i="${i}">${p.n}</button>`).join('')}
    </div>
    <div class="ring-wrap">
      <svg width="230" height="230" viewBox="0 0 230 230" style="transform:rotate(-90deg)" aria-hidden="true">
        <circle cx="115" cy="115" r="${R}" fill="none" stroke="rgba(185,201,217,.08)" stroke-width="6"/>
        <circle id="tRing" cx="115" cy="115" r="${R}" fill="none" stroke="${tcol}" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"
          style="transition:stroke-dashoffset .95s linear,stroke .3s"/>
      </svg>
      <div class="inner"><div>
        <div class="phase-tag ${T.running&&T.phase==='work'?'pulsing':''}" id="tPhase" style="color:${tcol}">${tlabel}</div>
        <div class="timer-num" id="tLeft">${fmtTime(T.left)}</div>
        <div class="hint" id="tRound">${(T.phase==='idle'||T.phase==='done')?cfg.rounds+' reprize':'repriza '+T.round+' / '+cfg.rounds}</div>
      </div></div>
    </div>
    <div class="grid2" style="margin-top:8px">
      ${T.running
        ? `<button class="btn" data-act="tpause">${ic('pause')} Pauză</button>`
        : `<button class="btn solid" data-act="tstart">${ic('play')} ${(T.phase==='idle'||T.phase==='done')?'Start':'Continuă'}</button>`}
      <button class="btn ghost" data-act="treset">${ic('reset')} Reset</button>
    </div>
    <div class="hint" style="margin-top:10px">Pentru reprize pe distanță, timpul de efort e orientativ — aleargă repriza după simțire și lasă cronometrul să-ți dea pauza fixă.</div>
  </div>

  <div class="panel"><div class="panel-t">${ic('grip')} Tracțiuni — Grease the Groove</div>
    <p class="muted">Serii submaximale, dese peste zi, <b>niciodată la eșec</b>. Acumulezi volum fără oboseală.</p>
    <div class="grid2" style="margin-top:14px">
      <div class="field"><label>Maximul tău actual (repetări)</label>
        <div style="display:flex;gap:8px">
          <input class="inp" type="number" inputmode="numeric" id="gtgMax" value="${max||''}" placeholder="ex. 11">
          <button class="btn solid" data-act="gtgmax" style="flex:none">Setează</button>
        </div></div>
      <div class="field"><label>Nota-țintă</label>
        <div style="padding-top:6px">${badge(max?noteHigher(max,PULL):null)}
        <span class="muted" style="margin-left:8px">${max?('din '+max+' rep'):'—'}</span></div></div>
    </div>
    ${max>0?`<div class="stats">
      <div class="stat"><div class="k">Țintă / serie</div><div class="v">${gtarget}</div></div>
      <div class="stat"><div class="k">Serii azi</div><div class="v">${gtoday.length}</div></div>
      <div class="stat"><div class="k">Total azi</div><div class="v">${gtotal} <small>rep</small></div></div>
    </div>
    <button class="btn solid" data-act="gtgadd" style="margin-top:14px;width:100%">${ic('plus')} Adaugă serie (${gtarget} rep)</button>
    ${gtoday.length?`<div class="sets">${gtoday.map((r,i)=>`<div class="setpill">${r}
      <button data-act="gtgdel" data-i="${i}" aria-label="Șterge seria">${ic('trash')}</button></div>`).join('')}</div>`:''}
    <div class="hint" style="margin-top:12px">Ținta: 50% din maxim, 5–8 serii pe zi la 30–60 min distanță. Plafon ~35–50 rep/zi.</div>`:''}
  </div>

  </div>`;
}

function runPlanPanel(){
  const b=S.planBlock==null?activeBlock():S.planBlock;
  const p=runPlan(b), warn=runWarnings();
  const chips=BLOCKS.map((B,i)=>`<button class="chip ${i===b?'on':''}" data-act="planBlock" data-i="${i}">Bloc ${i+1}</button>`).join('');
  const wk=[0,1,2,3].map(w=>runMinutes(b,w));
  const row=(key,label,unit)=>{
    const o=p[key], isL=key==='lng';
    const cells=[0,1,2,3].map(w=>`<td><input class="inp mini" type="number" inputmode="numeric" min="0"
        data-act="planSet" data-k="${key}" data-f="${isL?'w':'r'}" data-i="${w}"
        value="${isL?(o.w[w]||0):(o.r[w]||0)}"></td>`).join('');
    return `<tr><td class="pn">${label}</td>
      ${isL?'<td class="pm mono">min</td>':`<td><input class="inp mini" type="number" inputmode="decimal" step="0.5" min="0.5"
        data-act="planSet" data-k="${key}" data-f="m" value="${o.m}"></td>`}
      ${cells}</tr>`;
  };
  return `<div class="panel">
    <div class="panel-t">${ic('timer')} Planul meu de alergare</div>
    <p class="muted">Cifrele sunt ale tale. Pune câte reprize vrei în fiecare săptămână și cât durează una.
    Zilele de alergare din Workout se rescriu singure după ce schimbi aici.</p>
    <div class="chips" style="margin-top:12px">${chips}</div>
    <div class="scroll-x" style="margin-top:14px">
      <table class="tbl plan"><thead><tr>
        <th>Sesiune</th><th>Min/repriză</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th>
      </tr></thead><tbody>
        ${row('int','Intervale')}
        ${row('tmp','Tempo')}
        ${row('lng','Rulaj lung')}
      </tbody></table>
    </div>
    <div class="stats" style="grid-template-columns:repeat(4,1fr);margin-top:14px">
      ${wk.map((m,w)=>`<div class="stat"><div class="k">S${w+1}</div>
        <div class="v">${m.total.toFixed(0)}<small>min</small></div>
        <div class="k" style="margin-top:4px">${(m.total/RUN_PACE).toFixed(1)} km</div></div>`).join('')}
    </div>
    <div class="hint" style="margin-top:10px">Kilometrii sunt orientativi, calculați la ${mmss(RUN_PACE)} /km.
      Aplicația nu te oprește din nimic — doar îți spune când cifrele tale ies din ce arată cercetarea.</div>
    ${warn.length?warn.map(x=>`<div class="callout ${x.lvl==='bad'?'bad':''}" style="margin-top:10px">${ic(x.lvl==='bad'?'shield':'info')}
      <div class="ct"><b>${x.t}</b><br>${x.d}</div></div>`).join('')
     :`<div class="callout ok" style="margin-top:12px">${ic('check')}<div class="ct">
       Planul tău trece toate verificările: prima săptămână sub 3 km, trecerile între blocuri sub 10%,
       descărcare reală în săptămâna 4.</div></div>`}
    <button class="btn ghost" data-act="planReset" data-i="${b}" style="margin-top:12px">${ic('minus')} Revino la planul implicit pentru blocul ${b+1}</button>
  </div>`;
}

function runLogPanel(){
  const tk=todayKey(), wk=runWeek(tk), prev=runWeek(dayShift(tk,-7));
  const ch=prev.min>0?((wk.min-prev.min)/prev.min*100):null;
  const series=runWeeklySeries();
  const pf=painFlag();
  const rs=(S.runs||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  const kind=S.runKind||'lng';
  const paced=rs.filter(r=>r.kind===kind&&paceOf(r)!=null).slice(0,12).reverse();
  const chart=paced.length>1?lineChart(paced.map(r=>paceOf(r)),
    {target:KM[10]/60,reversed:true,fmt:v=>mmss(v),labels:paced.map(r=>shortDate(r.date))}):'';
  const bars=series.slice(-10);
  const maxKm=Math.max(1,...bars.map(b=>b.km));
  const volBars=bars.length?`<div class="volbars">${bars.map(b=>`<div class="vb">
      <div class="vb-t" style="height:${Math.max(3,b.km/maxKm*120)}px"></div>
      <div class="vb-k mono">${b.km.toFixed(1)}</div>
      <div class="vb-d mono">${shortDate(b.k)}</div></div>`).join('')}</div>`:'';

    <div class="panel-t">${ic('activity')} Jurnal de alergare</div>

    ${pf?`<div class="callout bad" style="margin-top:14px">${ic('shield')}<div class="ct"><b>Regula de oprire</b><br>${pf.msg}</div></div>`:''}

    <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:16px">
      <div class="stat"><div class="k">ULTIMELE 7 ZILE</div><div class="v">${wk.km.toFixed(1)}<small>km</small></div></div>
      <div class="stat"><div class="k">MINUTE</div><div class="v">${wk.min.toFixed(0)}</div></div>
      <div class="stat"><div class="k">FAȚĂ DE SĂPT. TRECUTĂ</div>

/* ---------- pauze & cronometru de sesiune ---------- */
function parseRest(detail,name){
  const t=(detail||'').toLowerCase();
  let m=t.match(/pauz[ăa]\s*(?:activ[ăa]\s*)?(\d+)\s*min/);      if(m) return +m[1]*60;
  m=t.match(/pauz[ăa]\s*(?:de\s*)?(\d+)\s*[–-]?\s*(\d+)?\s*s/); if(m) return +m[1];
  m=t.match(/pauz[ăa]\s*(\d+):(\d+)/);                            if(m) return +m[1]*60+ +m[2];
  if(/pauz[ăa]\s*complet|recuperare complet/.test(t)) return 240;
  const n=(name||'').toLowerCase();
  if(/încălzire|incalzire|cool[ -]?down|mobilitate|mobility|stretching|foam|somn|mers|drill|notează|respirație|reset|alergare|zona 2|alergat|bicicletă/.test(n)) return 0;
  if(/weighted|negative|nordic|front lever|planche/.test(n)) return 180;
  if(/maxim|la eșec|test/.test(n)) return 180;
  if(/gtg|submaximal/.test(n)) return 0;
  if(/push-up|dip|row|plank|hollow|dead bug|pallof|carry|hang|curl|raise|bridge|wheel|step-up/i.test(n)) return 90;
  return 120;
}
function startRest(sec,label){
  if(!sec) return;
  unlockAudio();
  S.rest={left:sec,total:sec,label:label||''};
  ensureDock(); paintDock();
}
function unlockAudio(){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
       if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
}
function sessElapsed(){ return S.sess? Math.max(0,Math.floor((Date.now()-S.sess.start)/1000)) : 0; }
function ensureDock(){
  document.body.classList.toggle('has-dock',!!(S.sess||S.rest));
  let d=document.getElementById('dock');
  if(!(S.sess||S.rest)){ if(d) d.remove(); stopDock(); return; }
  if(!d){ d=document.createElement('div'); d.className='dock'; d.id='dock'; document.body.appendChild(d); }
  if(!dockHandle) dockHandle=setInterval(dockTick,1000);
}
function stopDock(){ if(dockHandle){clearInterval(dockHandle);dockHandle=null;} }
function dockTick(){
  const si=document.getElementById('sessInline'); if(si&&S.sess) si.textContent=fmtTime(sessElapsed());
  if(S.rest){
    S.rest.left--;
    if(S.rest.left<=3&&S.rest.left>0) beep(880,.06);
    if(S.rest.left<=0){ beep(1320,.14); setTimeout(()=>beep(1320,.14),190); S.rest=null; ensureDock(); }
  }
  paintDock();
}
function paintDock(){
  const d=document.getElementById('dock'); if(!d) return;
  const R=16,C=2*Math.PI*R;
  let html='<div class="dock-in">';
  if(S.sess){
    html+=`<div class="dock-blk">${ic('timer')}<div>
      <div class="dock-k">ANTRENAMENT</div>
      <div class="dock-v mono">${fmtTime(sessElapsed())}</div></div></div>`;
  }
  if(S.rest){
    if(S.sess) html+='<div class="dock-sep"></div>';
    const frac=S.rest.left/S.rest.total;
    html+=`<div class="dock-blk">
      <svg class="dock-ring" viewBox="0 0 38 38" aria-hidden="true">
        <circle cx="19" cy="19" r="${R}" fill="none" stroke="rgba(185,201,217,.14)" stroke-width="3"/>
        <circle cx="19" cy="19" r="${R}" fill="none" stroke="var(--signal)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"
          transform="rotate(-90 19 19)" style="transition:stroke-dashoffset .9s linear"/>
      </svg>
      <div><div class="dock-k">PAUZĂ</div>
      <div class="dock-v rest mono">${fmtTime(S.rest.left)}</div></div></div>`;
  }
  html+='<div class="dock-acts">';
  if(S.rest) html+=`<button class="btn ghost sm" data-act="restStop">Sari</button>`;
  if(S.sess) html+=`<button class="btn solid sm" data-act="sessStop">Termină</button>`;
  html+='</div></div>';
  d.innerHTML=html;
}

/* ---------- randare ---------- */
function renderTabs(){

}

  v.innerHTML=VIEWS[S.tab]();
  if(S.tab!==lastTab){ v.classList.add('anim'); lastTab=S.tab; countUp(v); }

/* numere care urcă de la zero, doar la intrarea în filă */
function countUp(root){
  root.querySelectorAll('[data-cnt]').forEach(el=>{
    const to=parseFloat(el.dataset.cnt); if(!isFinite(to)) return;
    const dec=+el.dataset.dec||0, dur=720, t0=performance.now();
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=(to*e).toFixed(dec); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function applyBg(){
  const el=document.getElementById('bglayer'); if(!el) return;
  el.style.backgroundImage=S.bgImg?`url(${S.bgImg})`:'none';
  el.style.opacity=S.bgImg?((+S.bgOp||16)/100):0;
  const ib=document.querySelector('.intro-bg');
  if(ib) ib.style.backgroundImage=S.bgImg?`url(${S.bgImg})`:'none';
}

/* ---------- cronometru ---------- */
function beep(freq=1100,dur=.09){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,audioCtx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur+.02);
  }catch(e){}
}
function timerPaint(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  const el=document.getElementById('tLeft'); if(!el) return;
  const totalP=T.phase==='work'?cfg.work:T.phase==='rest'?cfg.rest:T.phase==='prep'?cfg.prep:1;
  const frac=(T.phase==='idle'||T.phase==='done')?0:T.left/totalP;
  const C=2*Math.PI*100;
  const col=T.phase==='work'?'var(--signal)':T.phase==='rest'?'var(--ok)':T.phase==='done'?'var(--ok)':'var(--mute2)';
  el.textContent=fmtTime(T.left);
  const ring=document.getElementById('tRing');
  if(ring){ring.setAttribute('stroke-dashoffset',C*(1-frac));ring.setAttribute('stroke',col);}
  const ph=document.getElementById('tPhase');
  if(ph){ph.textContent={work:'EFORT',rest:'PAUZĂ',prep:'PREGĂTIRE',done:'GATA',idle:'STANDBY'}[T.phase];
    ph.style.color=col; ph.classList.toggle('pulsing',T.running&&T.phase==='work');}
  const rd=document.getElementById('tRound');
  if(rd) rd.textContent=(T.phase==='idle'||T.phase==='done')?cfg.rounds+' reprize':'repriza '+T.round+' / '+cfg.rounds;
}
function timerTick(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  if(T.left>1){ T.left--; if(T.left<=3) beep(880,.06); timerPaint(); return; }
  if(T.phase==='prep'){ T.phase='work'; T.left=cfg.work; T.round=1; beep(1320,.12); }
  else if(T.phase==='work'){
    if(T.round>=cfg.rounds){ T.phase='done'; T.left=0; T.running=false; stopTimer();
      beep(660,.12); setTimeout(()=>beep(520,.12),150); setTimeout(()=>beep(392,.25),300); render(); return; }
    T.phase='rest'; T.left=cfg.rest; beep(980,.08);
  } else if(T.phase==='rest'){ T.phase='work'; T.left=cfg.work; T.round++; beep(1320,.12); }
  timerPaint();
}
function startTimer(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
       if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
  if(T.phase==='idle'||T.phase==='done'){ T.phase='prep'; T.left=cfg.prep; T.round=0; }
  T.running=true; stopTimer(); tickHandle=setInterval(timerTick,1000); render();
}
function stopTimer(){ if(tickHandle){clearInterval(tickHandle);tickHandle=null;} }

/* ---------- acțiuni ---------- */
async function save(key,val,prop){ S[prop]=val; await store.set(key,val); }

document.addEventListener('change',async ev=>{
  const el=ev.target.closest('[data-act="planSet"]'); if(!el) return;
  const b=S.planBlock==null?activeBlock():S.planBlock;
  const key=el.dataset.k, f=el.dataset.f, idx=el.dataset.i;
  const cur=runPlan(b), v=Math.max(0,+el.value||0);
  if(f==='m') cur[key].m=Math.max(0.5,v);
  else if(f==='r'){ cur[key].r=cur[key].r.slice(); cur[key].r[+idx]=v; }
  else if(f==='w'){ cur[key].w=cur[key].w.slice(); cur[key].w[+idx]=v; }
  const pl=Object.assign({},S.runPlan||{}); pl[b]=cur;
  await save('zece:runPlan',pl,'runPlan'); render();
});

document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, i=el.dataset.i, k=el.dataset.k, tk=todayKey();

    S.weekBlock=null; S.wWeek=nx2.w; S.openDay=nx2.d; render();

      if(el) el.scrollIntoView({behavior:'smooth',block:'center'});});

      await save('zece:cyc',c,'cyc'); S.weekBlock=null; S.wWeek=null; S.openDay=-1; }
    render(); return; }
  if(a==='gateRepeat'){ const b=shownBlock();
      const c=Object.assign({},S.cyc||{}); c[b]=cycOf(b)+1; await save('zece:cyc',c,'cyc');
      await save('zece:curBlock',b,'curBlock'); S.weekBlock=null; S.wWeek=null; S.openDay=-1;
      render(); return; }
  if(a==='gateBack'){ const b=shownBlock(); if(b>0){
      await save('zece:curBlock',b-1,'curBlock');
      const c=Object.assign({},S.cyc||{}); c[b-1]=(c[b-1]||1)+1; await save('zece:cyc',c,'cyc');
      S.weekBlock=null; S.wWeek=null; S.openDay=-1; }
    render(); return; }
  if(a==='wweek'){ S.wWeek=+i; S.openDay=-1; render(); return; }
  if(a==='metric'){ S.metric=k; render(); return; }
  if(a==='planBlock'){ S.planBlock=+i; render(); return; }
  if(a==='runKind'){ S.runKind=k; render(); return; }
  if(a==='planReset'){ const pl=Object.assign({},S.runPlan||{}); delete pl[+i];
    await save('zece:runPlan',pl,'runPlan'); render(); return; }

  if(a==='delRun'){ await save('zece:runs',(S.runs||[]).filter((_,j)=>j!==+i),'runs'); render(); return; }
  if(a==='pnote'){ S.paceNote=+i; render(); return; }
  if(a==='bgOp'){ await save('zece:bgOp',+i,'bgOp'); render(); return; }
  if(a==='bgClear'){ await save('zece:bg',null,'bgImg'); render(); return; }

  if(a==='tstart'){ startTimer(); return; }

    if(m>0) await save('zece:gtg',Object.assign({},S.gtg||{},{max:m,days:(S.gtg&&S.gtg.days)||{}}),'gtg');
    render(); return; }
  if(a==='gtgadd'){ const g=S.gtg||{}, days=Object.assign({},g.days||{});
    const t=Math.max(1,Math.round((g.max||0)*0.5));
    days[tk]=(days[tk]||[]).concat([t]);
    await save('zece:gtg',Object.assign({},g,{days}),'gtg'); render(); return; }
  if(a==='gtgdel'){ const g=S.gtg||{}, days=Object.assign({},g.days||{});
    days[tk]=(days[tk]||[]).filter((_,j)=>j!==+i);
    await save('zece:gtg',Object.assign({},g,{days}),'gtg'); render(); return; }

  if(a==='openday'){ S.openDay=S.openDay===+i?-1:+i; render(); return; }
  if(a==='ex'){ const x=el.dataset.x, log=Object.assign({},S.wlog||{});
    const day=Object.assign({},log[k]||{});
    if(day[x]) delete day[x]; else { day[x]=1; justEx=x; }
    log[k]=day; await save('zece:wlog',log,'wlog'); render(); return; }
  if(a==='exlog'){ S.exOpen=S.exOpen===el.dataset.x?null:el.dataset.x; render(); return; }
  if(a==='setadd'){ const nm=liftKey(el.dataset.n), L=Object.assign({},S.lifts||{});
    const h=(L[nm]||[]).slice(); let cur=h[h.length-1];
    if(!cur||cur.d!==tk){ cur={d:tk,s:[]}; h.push(cur); } else { cur=Object.assign({},cur,{s:cur.s.slice()}); h[h.length-1]=cur; }
    cur.s=cur.s.concat([[+el.dataset.w||0,+el.dataset.r||0]]);
    L[nm]=h.slice(-12); await save('zece:lifts',L,'lifts'); render(); return; }
  if(a==='setdel'){ const nm=liftKey(el.dataset.n), L=Object.assign({},S.lifts||{});
    const h=(L[nm]||[]).slice(); const cur=h[h.length-1];
    if(cur&&cur.d===tk){ const ns=cur.s.filter((_,j)=>j!==+i);
      if(ns.length) h[h.length-1]=Object.assign({},cur,{s:ns}); else h.pop(); }
    if(h.length) L[nm]=h; else delete L[nm];
    await save('zece:lifts',L,'lifts'); render(); return; }
  if(a==='rest'){ startRest(+el.dataset.r,el.dataset.x); render(); return; }
  if(a==='restStop'){ S.rest=null; ensureDock(); paintDock(); render(); return; }
  if(a==='sessStart'){ unlockAudio(); S.sess={date:k,start:Date.now()};
    await store.set('zece:sess',S.sess); ensureDock(); paintDock(); render(); return; }
  if(a==='sessStop'){
    if(S.sess){ const mins=Math.max(1,Math.round(sessElapsed()/60));
      const log=Object.assign({},S.wlog||{});
      log[S.sess.date]=Object.assign({},log[S.sess.date]||{},{__min:mins});
      S.sess=null; await store.set('zece:sess',null); await save('zece:wlog',log,'wlog'); }
    ensureDock(); render(); return; }
  if(a==='logMeal'){ const m=MEALS[+k]; const ml=Object.assign({},S.mlog||{});
    ml[tk]=(ml[tk]||[]).concat([{n:m[1],k:m[2],p:m[3],c:m[4],g:m[5]}]);
    await save('zece:mlog',ml,'mlog'); render(); return; }
  if(a==='unlogMeal'){ const ml=Object.assign({},S.mlog||{});
    ml[tk]=(ml[tk]||[]).filter((_,j)=>j!==+i);
    await save('zece:mlog',ml,'mlog'); render(); return; }
  if(a==='logCustom'){ const g=id=>document.getElementById(id);
    const nm=(g('cN').value||'').trim(), kk=+g('cK').value||0;
    if(!nm||!kk) return;
    const ml=Object.assign({},S.mlog||{});
    ml[tk]=(ml[tk]||[]).concat([{n:nm,k:kk,p:+g('cP').value||0,c:+g('cC').value||0,g:+g('cG').value||0}]);
    await save('zece:mlog',ml,'mlog'); render(); return; }
  if(a==='mslot'){ S.mOpen=S.mOpen===+i?-1:+i; render(); return; }
  if(a==='mfilter'){ S.mFilter=!S.mFilter; render(); return; }
  if(a==='wAdd'){ const val=parseFloat(document.getElementById('wIn').value);
    if(val>30&&val<300){ const w=Object.assign({},S.weights||{}); w[tk]=Math.round(val*10)/10;
      await save('zece:weights',w,'weights'); } render(); return; }
  if(a==='applyCut'){ const T=targets(), n=nSet();
    await save('zece:nutri',Object.assign({},n,{manual:T.kcal-(+i)}),'nutri'); render(); return; }
  if(a==='clearManual'){ await save('zece:nutri',Object.assign({},nSet(),{manual:null}),'nutri'); render(); return; }
  if(a==='wreset'){ const bb=shownBlock(), B=BLOCKS[bb], wk=(S.wWeek==null)?nextDay(bb).w:S.wWeek;
    const log=Object.assign({},S.wlog||{});
    B.days.forEach((_,d)=>{ const k2=dayKey(S.weekBlock,wk,d), keep=(log[k2]||{}).__min;
      if(keep) log[k2]={__min:keep}; else delete log[k2]; });
    await save('zece:wlog',log,'wlog'); render(); return; }

  if(a==='addTest'){
    const run=+document.getElementById('tM').value||0;
    const sp=document.getElementById('tSp').value, pu=document.getElementById('tPu').value;
    const kmRaw=(document.getElementById('tKm').value||'').trim();
    const s5=document.getElementById('tS5').value;
    /* 1000 m: acceptă „4:35", „4.35" sau secunde brute */
    let km=null;
    if(kmRaw){ const m=kmRaw.match(/^(\d+)\s*[:.]\s*(\d{1,2})$/);
      km=m?(+m[1]*60+ +m[2]):(+kmRaw||null);
      if(km!=null&&km<40) km=null; }
    if(!run&&!sp&&!pu&&km==null&&!s5) return;
    const next=S.tests.concat([{date:tk,run:run||null,sprint:sp?+sp:null,pull:pu?+pu:null,
      k1000:km,s50:s5?+s5:null}]);
    await save('zece:tests',next,'tests'); render(); return; }
  if(a==='delTest'){ await save('zece:tests',S.tests.filter((_,j)=>j!==+i),'tests'); render(); return; }

  if(a==='logWo'){ const w=S.workouts||{}, entries=(w.entries||[]).concat([
      {eid:Date.now()+'-'+Math.random().toString(36).slice(2,6),sid:k,date:tk,note:''}]);
    await save('zece:workouts',Object.assign({},w,{entries}),'workouts'); render(); return; }
  if(a==='delWo'){ const w=S.workouts||{};
    await save('zece:workouts',Object.assign({},w,{entries:(w.entries||[]).filter(e=>e.eid!==k)}),'workouts');
    render(); return; }
});

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='paceM'){ S.paceM=t.value; refreshPace(); }
  if(t.id==='paceS'){ S.paceS=t.value; refreshPace(); }
  if(t.id==='nAge'||t.id==='nH'||t.id==='nBf'){
    const key={nAge:'age',nH:'h',nBf:'bf'}[t.id], v=+t.value;
    clearTimeout(nutTimer);
    nutTimer=setTimeout(async()=>{
      if(!isFinite(v)||v<=0) return;
      await save('zece:nutri',Object.assign({},nSet(),{[key]:v}),'nutri');
      if(S.tab==='nutri') render();
    },800);
  }
});
let nutTimer=null;
let paceTimer=null;
function refreshPace(){ clearTimeout(paceTimer); paceTimer=setTimeout(()=>{ if(S.tab==='tools') render(); },600); }

document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id==='bgFile' && t.files && t.files[0]){
    try{
      const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(t.files[0]);});
      const img=new Image();
      await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
      const sc=Math.min(1,1000/Math.max(img.width,1));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      await save('zece:bg',c.toDataURL('image/jpeg',0.7),'bgImg');
      render();
    }catch(e){ alert('Nu am putut citi imaginea.'); }
    return;
  }
  if(t.dataset && t.dataset.setedit){
    const nm=liftKey(t.dataset.setedit), L=Object.assign({},S.lifts||{});
    const h=(L[nm]||[]).slice(), cur=h[h.length-1];
    if(cur&&cur.d===todayKey()){
      const ns=cur.s.map(x=>x.slice()); const idx=+t.dataset.i;
      if(ns[idx]){ ns[idx][t.dataset.f==='w'?0:1] = +t.value||0; }
      h[h.length-1]=Object.assign({},cur,{s:ns}); L[nm]=h;
      await save('zece:lifts',L,'lifts'); render();
    }
    return;
  }
  if(t.dataset && t.dataset.note){
    const w=S.workouts||{};
    const entries=(w.entries||[]).map(e=>e.eid===t.dataset.note?Object.assign({},e,{note:t.value}):e);
    await save('zece:workouts',Object.assign({},w,{entries}),'workouts');
  }
});

/* ---------- intro ---------- */
(function intro(){
  const el=document.getElementById('intro');
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const close=()=>{ if(!el.parentNode) return; el.classList.add('out'); setTimeout(()=>el.remove(),470); };
  setTimeout(close,reduced?600:2550);
  el.addEventListener('click',close);
})();

/* ---------- pornire ---------- */
(async function init(){
  render();
  const [t,g,l,w,wt,nu,kl,lf,cb,cc]=await Promise.all([store.get('zece:tests'),store.get('zece:gtg'),
    store.get('zece:wlog'),store.get('zece:workouts'),store.get('zece:weights'),
    store.get('zece:nutri'),store.get('zece:mlog'),store.get('zece:lifts'),
    store.get('zece:curBlock'),store.get('zece:cyc')]);
  const [bg,bgo]=await Promise.all([store.get('zece:bg'),store.get('zece:bgOp')]);
  if(bg) S.bgImg=bg; if(bgo) S.bgOp=bgo;
  if(typeof cb==='number') S.curBlock=cb; if(cc&&typeof cc==='object') S.cyc=cc;
  if(wt) S.weights=wt; if(nu) S.nutri=nu; if(kl) S.mlog=kl; if(lf) S.lifts=lf;
  if(Array.isArray(t)) S.tests=t;
  const [rp,rl]=await Promise.all([store.get('zece:runPlan'),store.get('zece:runs')]);
  if(rp&&typeof rp==='object') S.runPlan=rp;
  if(Array.isArray(rl)) S.runs=rl;
  if(g) S.gtg=g; if(l) S.wlog=l; if(w) S.workouts=w;
  const sv=await store.get('zece:sess'); if(sv&&sv.start) S.sess=sv;
  S.openDay=nextDay(activeBlock()).d;
  ensureDock(); paintDock();
  const last=latestFull();
  if(last&&last.pull) S.paceS=last.pull;
  { const t0=trend(); if(t0&&t0.last) S.paceM=Math.round(t0.last); }
  render();
})();
</script>
